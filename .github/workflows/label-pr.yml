name: Semantic PR labels
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
permissions:
  contents: read
  pull-requests: write
  issues: write
concurrency:
  group: jev-label-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Reviewed Jev labeler, pinned to an immutable revision.
      # Never check out the PR branch or execute its scripts with these permissions.
      - uses: 1jehuang/jev-pr-labeler@2b75326d4dd76069d304ba27d449e563213e91ce
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          repository: ${{ github.repository }}
          pull-request: ${{ github.event.pull_request.number }}
          apply: 'true'
