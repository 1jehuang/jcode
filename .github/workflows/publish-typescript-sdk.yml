name: Publish TypeScript SDK

env:
  JCODE_CI: "1"
  # CI builds without the local parallel-frontend rustc wrapper from
  # .cargo/config.toml (a POSIX shell script; see scripts/rustc-parallel-frontend).
  CARGO_BUILD_RUSTC_WRAPPER: ""

on:
  workflow_call:
    inputs:
      jcode_release_tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      jcode_release_tag:
        description: Released jcode tag whose binaries should be bundled
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish @1jehuang/jcode-sdk
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Enforce Rust and TypeScript SDK surface parity
        working-directory: ${{ github.workspace }}
        run: cargo test -p jcode-sdk parity -- --nocapture

      - name: Install dependencies
        run: npm ci

      - name: Test release versioning
        working-directory: ${{ github.workspace }}
        run: node --test scripts/test_version_sdk_release.mjs

      - name: Validate SDK
        run: npm run check

      - name: Select SDK release channel and version
        id: channel
        working-directory: ${{ github.workspace }}
        env:
          JCODE_RELEASE_TAG: ${{ inputs.jcode_release_tag }}
        run: node scripts/version_sdk_release.mjs "$JCODE_RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Download released jcode runtimes
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p sdk-runtime-assets
          gh release download "${{ inputs.jcode_release_tag }}" --dir sdk-runtime-assets \
            --pattern 'jcode-linux-x86_64.tar.gz' \
            --pattern 'jcode-linux-aarch64.tar.gz' \
            --pattern 'jcode-macos-x86_64.tar.gz' \
            --pattern 'jcode-macos-aarch64.tar.gz' \
            --pattern 'jcode-windows-x86_64.tar.gz' \
            --pattern 'jcode-windows-aarch64.tar.gz'

      - name: Prepare platform packages
        working-directory: ${{ github.workspace }}
        run: bash scripts/prepare_sdk_runtime_packages.sh sdk-runtime-assets

      # These must exist before the main package is published. npm selects only
      # the package matching the consumer's os/cpu from optionalDependencies.
      - name: Publish platform runtime packages
        working-directory: ${{ github.workspace }}
        run: |
          for package in sdk/npm/*; do
            name=$(node -p "require('./$package/package.json').name")
            version=$(node -p "require('./$package/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published, skipping"
              continue
            fi
            log=$(mktemp)
            if npm publish "$package" --access public --provenance --tag "${{ steps.channel.outputs.tag }}" >"$log" 2>&1; then
              cat "$log"
            else
              status=$?
              cat "$log"
              # A retry can race the registry's visibility of an accepted upload.
              # Only this exact duplicate conflict may defer to the mandatory
              # visibility gate below. Authentication and other errors stay fatal.
              if ! grep -Fq 'npm error code E409' "$log" || ! grep -Fq "Cannot publish over previously staged version \"$version\"" "$log"; then
                exit "$status"
              fi
              echo "Upload already accepted, waiting for registry visibility: $name@$version"
            fi
            rm -f "$log"
          done

      # npm can acknowledge a publish before registry metadata exposes it.
      # Do not make the SDK visible while its optional runtime is still missing.
      - name: Wait for platform runtime registry visibility
        working-directory: ${{ github.workspace }}
        run: |
          for package in sdk/npm/*; do
            name=$(node -p "require('./$package/package.json').name")
            version=$(node -p "require('./$package/package.json').version")
            visible=false
            for attempt in $(seq 1 20); do
              if actual=$(npm view "$name@$version" version --prefer-online) && [ "$actual" = "$version" ]; then
                visible=true
                break
              fi
              echo "Waiting for registry visibility: $name@$version ($attempt/20)"
              sleep 30
            done
            if [ "$visible" != true ]; then
              echo "Runtime package is not visible, refusing to publish SDK: $name@$version" >&2
              exit 1
            fi
          done

      - name: Publish with npm provenance
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version already published, skipping"
          else
            npm publish --access public --provenance --tag "${{ steps.channel.outputs.tag }}"
          fi
