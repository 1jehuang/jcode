name: Release Recovery Validation

on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/release-recovery.yml'
      - '.github/workflows/windows-companion.yml'
      - '.github/scripts/verify_windows_install.ps1'
      - 'scripts/*release*'
      - 'scripts/test_*release*.py'
      - 'tests/*release*.py'
      - 'scripts/install.sh'
      - 'scripts/install_justrust_ci.sh'
      - 'scripts/build_linux_compat.sh'
  push:
    branches: [master]
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/release-recovery.yml'
      - '.github/workflows/windows-companion.yml'
      - '.github/scripts/verify_windows_install.ps1'
      - 'scripts/*release*'
      - 'scripts/test_*release*.py'
      - 'tests/*release*.py'
      - 'scripts/install.sh'
      - 'scripts/install_justrust_ci.sh'
      - 'scripts/build_linux_compat.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Recovery regressions exercise historical tags in isolated clones.
          fetch-depth: 0
      - name: Test recovery, exact-commit authorization, public assets and watcher
        run: python3 -m unittest discover -s tests -p '*release*.py'
      - name: Test release preparation and announcements
        run: python3 -m unittest discover -s scripts -p 'test_*release*.py'
      - name: Test installer release metadata validation
        run: bash scripts/test_install_release_metadata.sh
