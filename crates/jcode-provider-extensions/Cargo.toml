[package]
name = "jcode-provider-extensions"
version = "0.1.0"
edition = "2024"
description = "Validated manifests and local registry for external jcode providers"
license = "MIT"
repository = "https://github.com/1jehuang/jcode"

[dependencies]
jcode-provider-protocol = { path = "../jcode-provider-protocol", version = "0.1.0" }
jcode-provider-subprocess = { path = "../jcode-provider-subprocess", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
dirs = "5"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "time"] }
