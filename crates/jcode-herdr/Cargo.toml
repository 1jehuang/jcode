[package]
name = "jcode-herdr"
version = "0.1.0"
edition = "2024"
description = "HERDR terminal runtime integration for jcode and ForgeCode — lifecycle state reporting, session identity, and screen manifests"

[lib]
name = "jcode_herdr"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "net", "io-util"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tempfile = "3"
