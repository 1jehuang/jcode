[package]
name = "jcode-desktop2"
version = "0.1.0"
edition = "2024"
publish = false
description = "Greenfield jcode desktop app: winit + wgpu + Vello + Parley over the harness API"

[dependencies]
anyhow = "1"
arboard = { version = "3", features = ["wayland-data-control"] }
jcode-build-meta = { path = "../jcode-build-meta" }
jcode-harness-api = { path = "../jcode-harness-api" }
jcode-render-core = { path = "../jcode-render-core" }
unicode-width = "0.2"
parley = "0.11"
pollster = "0.3"
serde_json = "1"
vello = "0.9"
winit = "0.30"

[[bin]]
name = "jcode-desktop2"
path = "src/main.rs"
