[package]
name = "jcode-codemode"
version = "0.1.0"
edition = "2024"
publish = false

# Embedded QuickJS sandbox for the opt-in `codemode` tool. The model writes a
# short JavaScript program that orchestrates harness tool calls; only what the
# host exposes is reachable (no filesystem, network, or process APIs). Kept in
# its own crate so the C build of QuickJS is compiled once and cached, and so
# app-core edits never recompile it.

[lib]
name = "jcode_codemode"
path = "src/lib.rs"

[dependencies]
futures = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

# rquickjs-sys ships no prebuilt FreeBSD bindings, and generating them needs
# libclang in the build VM. Codemode reports itself unavailable there instead.
[target.'cfg(not(target_os = "freebsd"))'.dependencies]
rquickjs = { version = "0.14", features = ["futures"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
