[package]
name = "jcode-terminal-image"
version = "0.1.0"
edition = "2024"
publish = false
description = "Terminal image display (Kitty/iTerm2/Sixel) and image metadata formatting helpers for jcode"

[lib]
name = "jcode_terminal_image"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
crossterm = { version = "0.29", optional = true }

[features]
# Terminal rendering (Kitty/iTerm2/Sixel). Only clients enable it. The shared
# runtime uses just the pure `metadata` helpers and stays terminal-free.
default = []
display = ["dep:crossterm"]
