[package]
name = "jcode-provider-grok-build-runtime"
version = "0.1.0"
edition = "2024"
description = "Grok Build subscription runtime for jcode over the Grok CLI chat proxy (direct HTTPS)"

[lib]
name = "jcode_provider_grok_build_runtime"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
# default-features = false: see jcode-provider-openrouter-runtime/Cargo.toml.
jcode-base = { path = "../jcode-base", default-features = false }
jcode-message-types = { path = "../jcode-message-types" }
jcode-provider-core = { path = "../jcode-provider-core" }
jcode-provider-openrouter-runtime = { path = "../jcode-provider-openrouter-runtime" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
