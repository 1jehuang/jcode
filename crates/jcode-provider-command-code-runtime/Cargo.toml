[package]
name = "jcode-provider-command-code-runtime"
version = "0.1.0"
edition = "2024"
description = "Command Code provider runtime (auth, discovery, streaming, quota/failover) for jcode, kept downstream of jcode-base"

[lib]
name = "jcode_provider_command_code_runtime"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures = "0.3"
jcode-base = { path = "../jcode-base", default-features = false }
jcode-message-types = { path = "../jcode-message-types" }
jcode-provider-command-code = { path = "../jcode-provider-command-code" }
jcode-provider-core = { path = "../jcode-provider-core" }
rand = "0.9.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "charset", "http2", "system-proxy", "rustls-tls", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "rt-multi-thread", "macros", "io-util"] }
tokio-stream = "0.1"

[dev-dependencies]
jcode-base = { path = "../jcode-base", default-features = false, features = ["test-support"] }
tempfile = "3"
