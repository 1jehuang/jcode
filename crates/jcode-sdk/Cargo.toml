[package]
name = "jcode-sdk"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust SDK for the jcode harness API: connect, drive sessions, stream events"

[dependencies]
anyhow = "1"
jcode-harness-api = { path = "../jcode-harness-api" }
jcode-provider-metadata = { path = "../jcode-provider-metadata" }
jcode-transport = { path = "../jcode-transport" }
jsonschema = { version = "0.49.3", default-features = false }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
tempfile = "3"
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
