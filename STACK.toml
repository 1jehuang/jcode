# STACK.toml — single source of truth for the local jcode stack.
#
# POLICY (2026-09-26): build locally, publish once.
# - New work lands as a feat/* branch merged into local/pr-stack. No clean
#   export, no upstream PR, until the stack is declared done.
# - The open PRs stay open (harmless). No new PRs are filed meanwhile.
# - Exception: genuine fixes to upstream bugs may file anytime.
# - NEVER file features or docs stacked on our own unmerged work
#   (lesson: #1515 garden docs filed on unmerged #1282, had to close it).
# - When the stack is declared done, export clean off-master branches in
#   dependency order (compaction-hooks first) and file in one batch.
#
# update-pr-stack.sh merges [order] top to bottom, skipping state="nested"
# and state="parked". gen-stack-md.sh regenerates STACK.md from this file
# plus live git/gh state. Edit THIS file to add/remove branches — never the
# script's branch list (it reads from here).

[stack]
base = "origin/master"
branch = "local/pr-stack"

# Merge order. Do not reorder without reason: later branches may assume
# earlier ones (e.g. progress-file assumes summary-schema fields exist).
[[branch]]
name = "feat/compaction-hooks"
state = "in-stack"
pr = 1282
note = "Base of the stack. Garden docs + historian depend on it."

